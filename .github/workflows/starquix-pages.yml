# Written by Starquix (Publish → GitHub Pages). Builds the branch Publish picked (STARQUIX_PAGES_BRANCH), else the default branch, on every push.
name: Deploy to GitHub Pages
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_name == (vars.STARQUIX_PAGES_BRANCH || github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm install
      - run: npx astro build --site "$SITE" ${BASE:+--base "$BASE"}
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}
      - run: node .github/starquix/rebase.mjs dist "$BASE"
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
